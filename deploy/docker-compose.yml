# Plain Docker Compose alternative to Coolify.
# Use this if you'd rather not run Coolify: it brings up Postgres + the app +
# Caddy (automatic HTTPS) on the VPS. Coolify is still the easier path for
# git-push deploys and backups, but this is here if you want full control.
#
#   docker compose --env-file deploy/.env up -d --build
#
# Needs: deploy/.env (see deploy/.env.example pattern in the repo / runbook).

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: cls
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cls
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cls"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cls:${POSTGRES_PASSWORD}@db:5432/cls
      AUTH_URL: https://league.simracing-hub.com
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_DISCORD_ID: ${AUTH_DISCORD_ID}
      AUTH_DISCORD_SECRET: ${AUTH_DISCORD_SECRET}
      INITIAL_ADMIN_DISCORD_USERNAMES: ${INITIAL_ADMIN_DISCORD_USERNAMES}
      IRLM_USERNAME: ${IRLM_USERNAME}
      IRLM_PASSWORD: ${IRLM_PASSWORD}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID}
      CRON_SECRET: ${CRON_SECRET}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN}
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
