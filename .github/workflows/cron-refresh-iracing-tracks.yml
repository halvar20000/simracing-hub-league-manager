name: Refresh iRacing track cache

# Weekly: Sundays at 04:00 UTC. iRacing rarely adds tracks more often
# than that. Manual button is available on /admin/iracing/tracks.
on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/cron/refresh-iracing-tracks
        run: |
          curl -sS -f -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://league.simracing-hub.com/api/cron/refresh-iracing-tracks
