name: Close RSVP embeds

on:
  schedule:
    # Every 15 minutes (UTC). Tighter than the other RSVP crons because
    # the visual delay between "closed for real" and "embed shows closed"
    # should be small.
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call cron endpoint
        run: |
          set -euo pipefail
          response=$(curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP_STATUS:%{http_code}" \
            https://league.simracing-hub.com/api/cron/rsvp-close)
          echo "$response"
          status=$(echo "$response" | tail -1 | sed 's/HTTP_STATUS://')
          if [ "$status" != "200" ]; then
            echo "::error::Endpoint returned HTTP $status"
            exit 1
          fi
